services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data_science/data:/data_science/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - STUDENT_DATA_PATH=/data_science/data/sample_students.csv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # The Vite dev server proxies /api/* to the backend service using its
      # Docker Compose service name. The browser only talks to port 3000.
      - VITE_BACKEND_PROXY_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
